# Basic stock palettes, loaded before extra_colors and settings-selected sets.
# These are also embedded in Launcher. Copy this file to AppData to customize it,
# or copy it as colors-custom.toml and select colors = "custom" in Launcher.toml.

[colors.salmon]
tab.gradient = [
    { at = 0, color = "#FFD0C8" },
    { at = 0.45, color = "#F7B1A5" },
    { at = 1, color = "#EC8D82" },
]
tab.hover = "#FFD0C8"
page.gradient = [{ at = 0, color = "#EC8D82" }, { at = 1, color = "#F6BDA9" }]
page.hover = "#7A423A"
outline = "#BC6659"
text = "#131313"

