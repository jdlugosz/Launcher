# Select this set with colors = "dark" in Launcher.toml.
# Copy this file to AppData as colors-custom.toml; select colors = "custom" to edit it.
# Generated from colors-light.toml by tools/generate-dark-colors.ps1.
# Each palette keeps its first source page hue, except Yellow at H=60 degrees.
# Page S decreases from 100% to 80%; B increases from 50% to 70%.
# Inactive tabs are flat at the midpoint: B=60%, S=90%.
# Tab hover: B=40%, S=100%; outline: B=75%, S=100%.
# Icon hover uses white for a strong frame against every hue.
# text is the tab-label color. Restart Launcher after editing.

[colors.salmon]
tab.gradient = [{ at = 0, color = "#99230F" }, { at = 1, color = "#99230F" }]
tab.hover = "#660F00"
page.gradient = [
    { at = 0, color = "#801300" },
    { at = 0.5, color = "#99230F" },
    { at = 1, color = "#B33824" },
]
page.hover = "#FFFFFF"
outline = "#BF1C00"
text = "#F2F2F2"

