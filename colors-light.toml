# Select this set with colors = "light" at the top of Launcher.toml.
# The first matching source wins: beside config (outside AppData), AppData, resource.
# Stops are literal sRGB colors; prism page shading uses this oblique ramp.
# The active tab normally keeps page.gradient[0]; tab.gradient shades inactive tabs.
# Inactive tab colors are independent of the active tab and page.
# tab.hover colors a hovered tab; page.hover colors a hovered launchable cell.
# Edit the middle/far hues freely. Restart Launcher to reload this file.

[colors.salmon]
tab.gradient = [{ at = 0, color = "#FFD0C8" }, { at = 1, color = "#FFD0C8" }]
tab.hover = "#F6A17C"
page.gradient = [
    { at = 0, color = "#FFD0C8" },
    { at = 0.5, color = "#FFBCA7" },
    { at = 1, color = "#F6A17C" },
]
page.hover = "#784636"
outline = "#B86C53"

