# All bundled color names, one page per color, along the top of the screen.
# Run this from Launcher's Examples tab. Change colors to "dark" to compare,
# or remove colors to see the always-loaded basic and extra definitions.
# Installed use keeps Demos\demo_many_colors.toml in the Launcher AppData profile.
# Right-click the running demo and choose Edit configuration to edit that copy.
# Notepad is launchable; the folder and information icons are decorative.
schema_version = 1
colors = "light"

[dock]
edge = "top"
display = "primary"
auto_hide = true
suppress_fullscreen = true

[grid]
columns = 30
rows = 3
icon_size_dip = 38.4
icon_spacing_px = 8

[appearance]
text_size_pt = 9
thickness = 2.4

[logging]
file = "demo_many_colors.log"

[[tabs]]
name = "salmon"
color = "salmon"
items = [
    { label = "Notepad", target = "notepad.exe", icon = { stock = "document" } },
    { kind = "break" },
    { icon = { stock = "folder" } },
    { kind = "break" },
    { icon = { stock = "information" } },
]

