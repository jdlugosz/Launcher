# Extra stock palettes, loaded after basic_colors and before settings-selected sets.
# These are also embedded in Launcher. Copy this file as colors-custom.toml to
# AppData, then select colors = "custom" in Launcher.toml to customize a copy.

[colors.copper]
tab.gradient = [
    { at = 0, color = "#FFE0C1" },
    { at = 1, color = "#E39954" },
]
tab.hover = "#FFE0C1"
page.gradient = [
    { at = 0, color = "#E39954" },
    { at = 0.03, color = "#F4D8BA" },
    { at = 1, color = "#F6C995" },
]
page.hover = "#53341C"
outline = "#80502B"

