    { label = "Shell32 ID 3", icon = { file = '%SystemRoot%\System32\SHELL32.dll', id = 3 } },
    { label = "Shell32 ID 4", icon = { file = '%SystemRoot%\System32\SHELL32.dll', id = 4 } },
]
